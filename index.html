<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      Baseline CSP as defense-in-depth. This is a meta-tag fallback only —
      in production this must be set as a real `Content-Security-Policy`
      HTTP response header at the server/CDN, which also lets it cover
      frame-ancestors and be non-overridable by injected markup.

      connect-src includes campusone-api's default dev origin
      (http://localhost:4000, matching httpClient.ts's VITE_API_BASE_URL
      fallback) since the API is a separate origin from this app, not
      same-site 'self' — without it every fetch is silently blocked.
      Update this if VITE_API_BASE_URL points elsewhere.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:4000; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!-- Lexend for headings, Inter for body/UI/data — see src/app/theme.ts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>CampusOne Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
